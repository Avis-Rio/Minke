packages:
  - "."
  - "packages/*"

enableGlobalVirtualStore: false

# Forge's rebuild stack pins the maintained @electron/node-gyp fork from Git.
blockExoticSubdeps: false

# Electron Forge needs dependencies resolvable from a flat node_modules tree.
nodeLinker: hoisted

overrides:
  '@codemirror/view': 6.43.9
  yauzl: 3.4.0
  # Resolve Harness development dependencies from the pinned source checkout.
  '@deepseek-ai/dsh-client-shortcuts': link:vendor/deepseek-harness/packages/client/shortcuts
  '@deepseek-ai/dsh-client-ui-primitives': link:vendor/deepseek-harness/packages/client/ui-primitives
  '@deepseek-ai/dsh-client-ui-sidebar-browser': link:vendor/deepseek-harness/packages/client/ui-sidebar-browser
  '@deepseek-ai/dsh-client-ui-settings-general': link:vendor/deepseek-harness/packages/client/ui-settings-general
  '@deepseek-ai/dsh-llm': link:vendor/deepseek-harness/packages/llm/llm
  '@deepseek-ai/dsh-typert-protocol': link:vendor/deepseek-harness/packages/typert/protocol

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true

minimumReleaseAgeExclude:
  - '@codemirror/view@6.43.9'
  - '@deepseek-ai/cordis@4.0.5'
  - '@deepseek-ai/cosmokit@1.8.6'
  - '@deepseek-ai/schemastery@3.18.5'

patchedDependencies:
  '@electron-forge/core@7.11.2': patches/@electron-forge__core@7.11.2.patch
  # Remove after a stable Forge release supports Vite 8's codeSplitting option.
  '@electron-forge/plugin-vite@7.11.2': patches/@electron-forge__plugin-vite@7.11.2.patch
